; AQROOT firmware — PlatformIO project
;
; Two environments share the same source tree:
;   * esp32-s3-aqroot : real-hardware build, flashed over USB via PlatformIO.
;   * wokwi           : identical firmware built with -DSIMULATION_MODE so radio/NFC/
;                       audio return realistic mock data. Used with wokwi.toml +
;                       diagram.json to test the whole UI in the browser with no hardware.
;
; FRAMEWORK: Arduino core for ESP32. Chosen over ESP-IDF so we get mature, drop-in
; libraries (LVGL, LovyanGFX, RadioLib, I2S) instead of hand-rolling
; register code. FreeRTOS is still underneath — the Arduino core runs on top of ESP-IDF.

; D-800 (Round-19 full review): a bare `pio run -t upload` builds and uploads
; EVERY environment in file order when none is named, and the legacy
; placeholder images drive nets the Demo board's own parts drive (DISP_BL 21
; onto /WAKE_INT_N, RADIO_NSS 8 onto /SX1262_BUSY, I2C_SCL 18 onto /NFC_IRQ).
; The Demo release image is the default; the other three build only by name.
;
; D-801 / D801-03 (Round-20): and it is the SOLE default, which
; `checks/firmware_hw_map_contract.py` H9 now asserts -- Astra showed a legacy
; default here left H1-H8 green.  Missing, legacy, mixed or multi-line defaults
; and the FAP-01 diagnostic environment as a default are each a destructive
; control H9 must refuse.  Every other environment -- esp32-s3-aqroot, wokwi,
; esp32-s3-aqroot-dm and aqroot-demo-fap01 -- builds ONLY BY NAME
; (`pio run -e <name>`).  Do not add `extra_configs` here: an extra file could
; re-define the default behind this line, and H9 refuses one.
[platformio]
default_envs = aqroot-demo

[common]
; Pinned to the 6.x line (Arduino-ESP32 2.0.x / ESP-IDF 4.4). This keeps the legacy
; driver/i2s.h API used by audio.cpp valid — the 7.x line (Arduino 3.x / IDF 5.x) removed
; it in favour of driver/i2s_std.h. Bump deliberately, not implicitly.
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; The legacy application tree (src/main.cpp + drivers/ + ui/) and the AQROOT Demo
; tree (src/demo/ + src/hw/) each define setup()/loop().  Exactly one of them is
; compiled into any given environment.
; D-801: src/fap01/ (the FAP-01 first-article diagnostic image) is compiled by
; [env:aqroot-demo-fap01] ALONE; `+<*>` would otherwise pull it into the legacy
; builds, where its own #error refuses to compile without the diagnostic define.
legacy_src_filter = +<*> -<demo/> -<hw/> -<fap01/>

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; LVGL picks up include/lv_conf.h via a simple include (see include/lv_conf.h).
    ; The -I is required so the separately-compiled LVGL *library* sees lv_conf.h too;
    ; PlatformIO only adds include/ to the application build, not to library builds.
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    ; LovyanGFX v1 API.
    -DLGFX_USE_V1

lib_deps =
    lvgl/lvgl @ ^8.3.0
    jgromes/RadioLib @ ^6.4.0
    ; !! WRONG PART: the locked NFC front-end is the ST25R3916 over SPI, not a PN532 over
    ; I2C. This dependency goes away with the driver rewrite (see 07 - Build TODO Tracker).
    adafruit/Adafruit PN532 @ ^1.3.3
    adafruit/Adafruit BusIO @ ^1.14.0
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    lovyan03/LovyanGFX @ ^1.1.0
    ; --- IMU (6-axis accel + gyro) ---
    ; The IMU part IS now locked: BMI270 @ I2C 0x68, Alpha-validated (accel reads -1.00g on
    ; the down axis, gyro responds to rotation). The dependency is still absent because the
    ; BMI270 needs a multi-KB config blob uploaded at init, and sensors.cpp currently does a
    ; generic 6-axis I2C register read with only Wire (no external dep) — which will NOT
    ; return motion data on a real BMI270. Adding the library below and swapping the
    ; register map in sensors.cpp is outstanding work (see 07 - Build TODO Tracker).
    ; Alpha used and validated:
    ;   sparkfun/SparkFun BMI270 Arduino Library

; ----------------------------------------------------------------------------------------
; Real hardware
[env:esp32-s3-aqroot]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_flags =
    ${common.build_flags}
    ; DELIBERATE: this environment builds the legacy Beta application, whose pins in
    ; src/config.h are PLACEHOLDERS and collide with real AQROOT Demo functions.  The
    ; acknowledgement is stated here, in the environment, so that any NEW environment --
    ; and anyone who reaches for this one to program a Demo board -- hits config.h's
    ; #error and is sent to [env:aqroot-demo] instead.  DO NOT FLASH THIS IMAGE ONTO AN
    ; ASSEMBLED AQROOT DEMO BOARD.
    -DAQROOT_ACK_PLACEHOLDER_PINS
lib_deps = ${common.lib_deps}
; The AQROOT Demo tree carries its own setup()/loop(); keep it out of the legacy
; application builds.  See [env:aqroot-demo] at the end of this file.
build_src_filter = ${common.legacy_src_filter}

; ----------------------------------------------------------------------------------------
; Wokwi simulation build. Same firmware; SIMULATION_MODE swaps radio/NFC/audio for mock
; data and enables physical-button navigation (Wokwi has no capacitive-touch model).
[env:wokwi]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_flags =
    ${common.build_flags}
    -DSIMULATION_MODE
lib_deps = ${common.lib_deps}
build_src_filter = ${common.legacy_src_filter}

; ----------------------------------------------------------------------------------------
; Beta DM (demo model) hardware build. SAME source tree as esp32-s3-aqroot -- this is a
; build configuration, NOT a firmware fork. CONFIG_AQROOT_DM selects the AQROOT_HAS_*
; feature gates in src/config.h so the speaker, physical NFC and IR blocks that the DM
; board does not populate are compiled out. LoRa, sub-GHz, display, touch, microSD, IMU,
; buttons, the J5 header and the microphone all stay on.
;
; Scope of record: hardware/beta-dm/BETA-DM-SCOPE-LEDGER.md
[env:esp32-s3-aqroot-dm]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_flags =
    ${common.build_flags}
    -DCONFIG_AQROOT_DM
lib_deps = ${common.lib_deps}
build_src_filter = ${common.legacy_src_filter}

; ----------------------------------------------------------------------------------------
; AQROOT DEMO -- AS-BUILT BRING-UP TARGET.  THIS IS THE ENVIRONMENT THAT MATCHES THE BOARD
; BEING FABRICATED.
;
; It compiles src/demo/ + src/hw/ ONLY.  The legacy application tree above still carries
; Beta-era placeholder pins and two wrong parts (PN532 for the ST25R3916, ILI9341 geometry
; for the 3.5" ILI9488 panel), and it is deliberately NOT built here: a bring-up target
; whose job is to prove the pin map must not inherit a pin map from anywhere else.
;
; The pin map it does use is generated:
;     python3 hardware/demo/manufacturing/gen_firmware_hw_map.py
; and re-checked by
;     python3 hardware/demo/manufacturing/checks/firmware_hw_map_contract.py
;
; NO EXTERNAL LIBRARIES.  Arduino core only -- a bring-up image that cannot build because a
; UI dependency moved is a bring-up image that is not there when the first board arrives.
[env:aqroot-demo]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
; ESP32-S3-WROOM-1-N16R8: 16 MB QUAD flash + 8 MB OCTAL PSRAM (DEVICE_SPEC section 1).
; qio_opi is the memory type that pairing requires; the stock devkit profile assumes a
; smaller part and leaves the PSRAM unusable.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    ; The console is the ESP32-S3's NATIVE USB (GPIO19/20).  There is no USB-UART bridge
    ; on this board by design -- DEVICE_SPEC section 4.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<demo/> +<hw/>
lib_deps =

; ----------------------------------------------------------------------------------------
; D-801 / D801-01.  FAP-01 -- THE FIRST-ARTICLE DIAGNOSTIC IMAGE.
;
;   NEVER SHIPPED.  NEVER A DEFAULT.  BUILD AND FLASH ONLY BY NAME:
;       pio run -e aqroot-demo-fap01
;       pio run -e aqroot-demo-fap01 -t upload
;
; The SAME src/demo/ + src/hw/ as [env:aqroot-demo] -- every release gate,
; permission row, quiesce and liveness rule unchanged -- plus src/fap01/, the
; bounded bench stimuli the first-article plan needs (CC1101 continuous TX,
; SX1262 CW, NFC field, a Wi-Fi burst, a 38 kHz NEC IR burst, chip-select
; hold-off for U7/U9, held audio, a held backlight duty after the D-784 prime,
; a 10 ms VCELL poll).  AQROOT_FAP01_DIAGNOSTIC is defined HERE ONLY; src/fap01/
; refuses to compile without it and every hook in src/demo/main.cpp is guarded
; by it.  Procedure, console and source identity:
;     docs/full-beta-v2/assembly/FAP01_FIRST_ARTICLE_IMAGE.md
; `checks/firmware_hw_map_contract.py` H9/H10 refuse this environment as a
; default, the define or src/fap01/ in any other environment, and H6 runs its
; host tests (and the whole release-image host test) against this build.
[env:aqroot-demo-fap01]
extends = env:aqroot-demo
build_flags =
    ${env:aqroot-demo.build_flags}
    -DAQROOT_FAP01_DIAGNOSTIC
build_src_filter = -<*> +<demo/> +<hw/> +<fap01/>
