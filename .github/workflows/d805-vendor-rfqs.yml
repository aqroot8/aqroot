name: D805 Vendor RFQ Artifacts
on:
  push:
    branches:
      - d805-pcbway-delivery-artifact
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify archives
        run: |
          unzip -t delivery/vendor-rfqs/AQROOT_D805_JLCPCB_RFQ.zip >/dev/null
          unzip -t delivery/vendor-rfqs/AQROOT_D805_NextPCB_RFQ.zip >/dev/null
          unzip -t delivery/vendor-rfqs/AQROOT_D805_Seeed_Fusion_RFQ.zip >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: AQROOT_D805_JLCPCB_RFQ
          path: delivery/vendor-rfqs/AQROOT_D805_JLCPCB_RFQ.zip
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: AQROOT_D805_NextPCB_RFQ
          path: delivery/vendor-rfqs/AQROOT_D805_NextPCB_RFQ.zip
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: AQROOT_D805_Seeed_Fusion_RFQ
          path: delivery/vendor-rfqs/AQROOT_D805_Seeed_Fusion_RFQ.zip
          compression-level: 0
          retention-days: 3
