name: D805 MultiVendor RFQ Artifact
on:
  push:
    branches:
      - d805-pcbway-delivery-artifact
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify package
        run: |
          echo "34ea862650f5b161c8763796300b6f802aa9a44eb61cab5b6acb9935dbd62d14  delivery/AQROOT_D805_Prototype_PCBA_RFQ.zip" | sha256sum -c -
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: AQROOT_D805_Prototype_PCBA_RFQ
          path: delivery/AQROOT_D805_Prototype_PCBA_RFQ.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
