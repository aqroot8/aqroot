name: D805 MultiVendor RFQ Artifact
on:
  push:
    branches:
      - d805-pcbway-delivery-artifact
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify package
        run: |
          echo "eefa9f3c16bc1a228669b3dc8f05e3a0f0892d4727c71a0fc33c1a170069594a  delivery/AQROOT_D805_Prototype_PCBA_RFQ.zip" | sha256sum -c -
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: AQROOT_D805_Prototype_PCBA_RFQ
          path: delivery/AQROOT_D805_Prototype_PCBA_RFQ.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
