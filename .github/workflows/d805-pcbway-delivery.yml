name: D805 PCBWay Delivery Artifact
on:
  push:
    branches:
      - d805-pcbway-delivery-artifact
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify package checksums
        run: |
          cd delivery/AQROOT_D805_PCBWay_Requote
          sha256sum -c SHA256SUMS.txt
      - name: Upload D805 package
        uses: actions/upload-artifact@v4
        with:
          name: AQROOT_D805_PCBWay_Requote
          path: delivery/AQROOT_D805_PCBWay_Requote/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
